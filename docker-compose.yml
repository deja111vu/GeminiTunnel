services:
  proxy:
    build: .
    image: gemini-tunnel:local
    container_name: gemini-tunnel
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # override only if you change the host-side mount
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      # Persist the SQLite DB + WAL outside the container. The directory
      # on the host must exist; if it doesn't, `docker compose up` will
      # create it as root — chown it to 1000:1000 to match the in-image
      # `node` user, otherwise the first run will fail to open the DB.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
